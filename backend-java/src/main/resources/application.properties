server.port=8080
# API Prefix to match frontend's baseURL (http://localhost:8080/api)
server.servlet.context-path=/api

spring.data.mongodb.uri=mongodb://localhost:27017/role_based_file_sharing

# JWT configuration (inject via JWT_SECRET environment variable)
rbfs.jwtSecret=${JWT_SECRET:rbfs_default_dev_jwt_secret_replace_in_env}
rbfs.jwtExpirationMs=86400000

# File Encryption configuration (AES-256 key: 32 bytes, inject via RBFS_ENCRYPTION_KEY environment variable)
rbfs.encryptionKey=${RBFS_ENCRYPTION_KEY:rbfs_default_aes_key_32bytes!!}

# File Upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom property for upload directory
file.upload-dir=./uploads
